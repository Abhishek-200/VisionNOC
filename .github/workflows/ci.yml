# VisionNOC — .github/workflows/ci.yml
#
# STATUS: NOT VERIFIED. This sandbox cannot run GitHub Actions (no
# runner, no network to github.com — see docs/PROJECT_STATUS.md). The
# steps mirror exactly what was actually run and verified locally in
# this sandbox (see docs/TESTING.md): `pip install` the verified subset,
# then `python -m unittest discover`. BLOCKED — USER ACTION REQUIRED:
# push this to a GitHub repo and confirm the workflow runs green; report
# back any environment differences (e.g. GitHub's runner may have
# different libgl availability for opencv-python).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OpenCV 5
        run: python -c "import cv2; assert cv2.__version__.startswith('5.'), cv2.__version__; print(cv2.__version__)"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build API Docker image
        run: docker build -f docker/Dockerfile.api -t visionnoc-api:ci .
